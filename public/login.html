<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081a2b" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zentrid" />
  <title>Zentrid Mobile Login</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
</head>
<body class="mobile-login-page">
  <main class="mobile-login-shell">
    <section class="mobile-login-visual">
      <div class="mobile-login-brand"><span>Z</span><strong>Zentrid</strong></div>
      <div class="mobile-login-copy">
        <span class="mobile-eyebrow light">End User Mobile</span>
        <h1>Your plant in your pocket.</h1>
        <p>Plant status, devices, alerts, energy and commercial information from one secure mobile app.</p>
      </div>
    </section>
    <section class="mobile-login-form-wrap">
      <div class="mobile-login-form-head"><h2>Welcome back</h2><p>Sign in with your Zentrid account.</p></div>
      <form id="loginForm" class="mobile-login-form">
        <label><span>Username</span><input name="username" autocomplete="username" required placeholder="Enter username" /></label>
        <label><span>Password</span><input name="password" type="password" autocomplete="current-password" required placeholder="Enter password" /></label>
        <button type="submit">Sign in</button>
        <div id="loginStatus" class="mobile-login-status info">Sign in to monitor your plant from your phone.</div>
      </form>
      <p class="mobile-login-foot">Protected by Zentrid Auth</p>
    </section>
  </main>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
